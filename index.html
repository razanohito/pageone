<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ページワン 十番勝負</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 夜の食卓。ペンダントライトに照らされた胡桃材のテーブル、各席はリネンのランチョンマット、中央はテーブルランナー。
   単一テーマ（食卓の色で固定） */
:root{
  color-scheme: dark;
  --wood-1:#2e1c11;
  --wood-2:#4a2e1c;
  --wood-3:#5d3b25;
  --ink:#f7ecd6;
  --muted:#cdb797;
  --line:rgba(247,236,214,.16);
  --mat:rgba(244,232,208,.07);
  --mat-edge:rgba(244,232,208,.22);
  --card:#fffaf0;
  --card-2:#f3e8d2;
  --card-ink:#24180e;
  --red:#a8222a;
  --gold:#d6a24a;
  --gold-2:#f1cf86;
  --gold-ink:#2b1a05;
  --wine:#6e1620;
  --danger:#c4433f;
  --ok:#93c083;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-card:"Playfair Display","Shippori Mincho B1",Georgia,serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
html,body{background:var(--wood-1);color:var(--ink)}
body{
  font-family:var(--f-body);font-size:15px;line-height:1.55;min-height:100%;
  background:
    radial-gradient(70% 45% at 50% 0%, rgba(255,214,150,.30), rgba(255,214,150,0) 70%) fixed,
    radial-gradient(130% 90% at 50% 40%, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%) fixed,
    repeating-linear-gradient(178deg, rgba(0,0,0,.10) 0 2px, rgba(0,0,0,0) 2px 9px, rgba(255,255,255,.025) 9px 11px, rgba(0,0,0,0) 11px 23px) fixed,
    linear-gradient(180deg, var(--wood-3), var(--wood-2) 40%, var(--wood-1)) fixed,
    var(--wood-1);
}
.wrap{
  max-width:780px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px 32px;
  display:flex;flex-direction:column;gap:14px;
}
.screen{display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px}

/* language */
.langbar{display:flex;justify-content:flex-end}
.lang{display:inline-flex;border:1px solid var(--mat-edge);border-radius:999px;overflow:hidden;background:rgba(0,0,0,.25)}
.lang button{background:transparent;border:none;color:var(--muted);font-size:.78rem;font-weight:700;padding:4px 11px;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink)}

/* header */
.top{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.top h1{font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin:0;letter-spacing:.06em;flex:1 1 auto;text-wrap:balance;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.top h1 small{font-family:var(--f-body);font-size:.75rem;color:var(--muted);margin-left:8px;letter-spacing:.08em;font-weight:500;text-shadow:none}
.chip{border:1px solid var(--mat-edge);border-radius:999px;padding:3px 11px;font-size:.8rem;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.25)}
.chip.gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink);border-color:var(--gold)}
.ghost{background:rgba(0,0,0,.25);color:var(--muted);border:1px solid var(--mat-edge);border-radius:8px;padding:4px 10px;font-size:.8rem}
.ghost:hover{color:var(--ink)}

/* マット（パネル共通） */
.box,.seat,.me,.mode{
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, rgba(0,0,0,0) 2px 4px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 2px, rgba(0,0,0,0) 2px 4px),
    var(--mat);
  border:1px solid var(--mat-edge);
  box-shadow:0 10px 24px rgba(0,0,0,.35), inset 0 0 0 4px rgba(0,0,0,.12);
  backdrop-filter:blur(2px);
}

/* home & lobby */
.hero{display:flex;flex-direction:column;gap:8px;padding-block:6px 2px;align-items:flex-start}
.hero h2{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,8.5vw,3rem);margin:0;line-height:1.15;letter-spacing:.05em;text-wrap:balance;text-shadow:0 3px 14px rgba(0,0,0,.55)}
.hero h2 .b{color:var(--gold-2)}
.hero p{margin:0;color:var(--muted);max-width:52ch}
.hero-cards{display:flex;gap:0;margin:4px 0 2px;padding-left:6px}
.hero-cards .card{width:54px;transform-origin:50% 120%}
.hero-cards .card:nth-child(1){transform:rotate(-14deg) translateX(8px)}
.hero-cards .card:nth-child(2){transform:rotate(-5deg) translateX(2px) translateY(-4px);z-index:1}
.hero-cards .card:nth-child(3){transform:rotate(5deg) translateX(-4px) translateY(-4px);z-index:2}
.hero-cards .card:nth-child(4){transform:rotate(14deg) translateX(-10px);z-index:3}
.box{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-size:.8rem;letter-spacing:.14em;color:var(--gold-2);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
input[type=text]{font:inherit;font-size:16px;background:var(--card);color:var(--card-ink);border:1px solid var(--gold);border-radius:9px;padding:10px 12px;flex:1 1 180px;min-width:0}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{border-radius:14px;color:var(--ink);text-align:left;padding:16px;display:flex;flex-direction:column;gap:4px}
.mode b{font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--gold-2)}
.mode span{font-size:.82rem;color:var(--muted)}
.mode:hover:not(:disabled){border-color:var(--gold)}
.mode:disabled{opacity:.45;cursor:default}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.tbl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}
.tbl:first-child{border-top:none;padding-top:0}
.tbl .who{flex:1 1 200px;min-width:0;font-size:.88rem}
.tbl .code{font-family:var(--f-card);font-weight:700;color:var(--gold-2);margin-right:6px}
.tag{font-size:.7rem;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--line);color:var(--ink);white-space:nowrap}
.tag.live{background:var(--ok);color:#13240d}
.seatlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seatbox{border:1px dashed var(--mat-edge);border-radius:10px;padding:10px;min-height:56px;display:flex;flex-direction:column;gap:2px;min-width:0}
.seatbox.filled{border-style:solid;background:rgba(0,0,0,.15)}
.seatbox small{color:var(--muted);font-size:.72rem}
.empty-note{color:var(--muted);font-size:.85rem;margin:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--mat-edge);border-radius:10px;overflow:hidden;background:rgba(0,0,0,.2)}
.seg button{background:transparent;border:none;color:var(--muted);font-weight:700;font-size:.92rem;padding:9px 4px}
.seg button + button{border-left:1px solid var(--mat-edge)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink)}
.seg button:disabled{cursor:default}
.title-row{display:flex;flex-direction:column;gap:2px}
.title-big{font-family:var(--f-display);font-weight:800;font-size:1.8rem;color:var(--gold-2);line-height:1.2;text-shadow:0 2px 10px rgba(214,162,74,.35)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px;margin:0}
.stats div{min-width:0}
.stats dt{font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.stats dd{margin:0;font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ttl{font-size:.66rem;font-weight:700;border:1px solid var(--gold);color:var(--gold-2);border-radius:4px;padding:0 5px;white-space:nowrap}

/* seats */
.seats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seat{border-radius:12px;padding:8px 9px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s, box-shadow .2s;min-width:0}
.seat.is-turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 22px rgba(241,207,134,.28),0 10px 24px rgba(0,0,0,.35)}
.seat-head{display:flex;align-items:center;gap:6px;min-height:22px;min-width:0;flex-wrap:wrap}
.seat-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.p1{font-size:.68rem;font-weight:700;background:var(--danger);color:#fff;border-radius:4px;padding:1px 5px;letter-spacing:.04em;white-space:nowrap}
.minis{display:flex;flex-wrap:wrap;gap:0;min-height:22px;padding-left:4px}
.minis i{width:13px;height:19px;margin-left:-4px;border-radius:2px;border:1px solid var(--card);
  background:
    radial-gradient(circle at 50% 50%, var(--gold-2) 0 1.5px, rgba(0,0,0,0) 2px),
    repeating-linear-gradient(45deg, rgba(241,207,134,.55) 0 1px, rgba(0,0,0,0) 1px 4px),
    repeating-linear-gradient(-45deg, rgba(241,207,134,.55) 0 1px, rgba(0,0,0,0) 1px 4px),
    var(--wine);
  box-shadow:1px 1px 0 rgba(0,0,0,.35)}
.seat-meta{display:flex;justify-content:space-between;gap:6px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* 中央：テーブルランナー */
.board{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:16px;align-items:center;justify-content:start;padding:14px;border-radius:14px;
  background:
    linear-gradient(90deg, rgba(0,0,0,0) 0 10px, rgba(214,162,74,.35) 10px 11px, rgba(0,0,0,0) 11px calc(100% - 11px), rgba(214,162,74,.35) calc(100% - 11px) calc(100% - 10px), rgba(0,0,0,0) calc(100% - 10px)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 2px, rgba(0,0,0,0) 2px 5px),
    linear-gradient(180deg, #4b1a1f, #3a1217);
  border:1px solid rgba(214,162,74,.45);
  box-shadow:0 14px 30px rgba(0,0,0,.45), inset 0 0 30px rgba(0,0,0,.35)}
.stack{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}
.back{position:relative;width:60px;aspect-ratio:5/7;border-radius:8px;border:3px solid var(--card);
  background:
    radial-gradient(circle at 50% 50%, var(--gold-2) 0 5px, var(--gold) 5px 7px, rgba(0,0,0,0) 7.5px),
    radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 0 13px, rgba(241,207,134,.8) 13px 14px, rgba(0,0,0,0) 14.5px),
    repeating-linear-gradient(45deg, rgba(241,207,134,.45) 0 1px, rgba(0,0,0,0) 1px 6px),
    repeating-linear-gradient(-45deg, rgba(241,207,134,.45) 0 1px, rgba(0,0,0,0) 1px 6px),
    var(--wine);
  box-shadow:2px 2px 0 var(--card-2),4px 4px 0 var(--card),5px 6px 10px rgba(0,0,0,.5), inset 0 0 0 2px var(--gold)}
.back.empty{background:transparent;border:2px dashed var(--mat-edge);box-shadow:none}
.info{display:flex;flex-direction:column;gap:2px;min-width:0}
.info .lbl{font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.info .line{font-family:var(--f-card);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums}
.info .line b{color:var(--gold-2);font-weight:700}
.info .line small{font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:400}
.info .status{font-size:.85rem;display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
.info .status .suit{font-size:1.1rem;font-weight:700}
.info .status .suit.red{color:#ff9a9a}
.info .status .warn{background:var(--danger);color:#fff;border-radius:4px;padding:0 6px;font-weight:700}
.info .order{font-size:.75rem;color:var(--muted)}
.info .turn{margin-top:4px;font-weight:700;color:var(--gold-2)}

/* カード：象牙の札・真鍮の縁 */
.card{
  width:clamp(44px,12vw,64px);aspect-ratio:5/7;max-width:100%;
  border-radius:8px;border:1px solid #c9a35a;
  background:
    linear-gradient(135deg, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 38%),
    radial-gradient(120% 90% at 50% 50%, var(--card) 55%, var(--card-2) 100%);
  color:var(--card-ink);
  display:grid;grid-template-rows:auto 1fr auto;padding:3px 4px;
  font-family:var(--f-card);line-height:1;
  box-shadow:inset 0 0 0 2px var(--card), inset 0 0 0 3px rgba(201,163,90,.75), 0 1px 0 rgba(255,255,255,.5), 2px 4px 8px rgba(0,0,0,.45);
  transition:transform .15s, opacity .15s, box-shadow .15s;
  position:relative;
}
.card.red{color:var(--red)}
.card .r{font-size:.9rem;font-weight:700;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:.95}
.card .r small{font-family:var(--f-body);font-size:.62rem}
.card .rb{align-items:flex-end;transform:rotate(180deg)}
.card .s{font-family:var(--f-body);font-size:1.5rem;display:grid;place-items:center;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.card .s.face{position:relative;margin:2px 6px;border:1px solid rgba(201,163,90,.9);border-radius:4px;
  background:linear-gradient(180deg, rgba(214,162,74,.18), rgba(214,162,74,.04));grid-template-rows:auto auto;align-content:center;gap:0}
.card .s.face .emb{font-size:1.05rem;color:#9a7128;line-height:1}
.card .s.face .fs{font-size:.95rem;line-height:1}
.card .fx{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);font-family:var(--f-body);font-size:.58rem;font-weight:700;background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink);border-radius:3px;padding:1px 4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.card.big{width:66px}
.card.big .s{font-size:1.8rem}
.card.big .s.face .emb{font-size:1.25rem}
.hand .card.ok{transform:translateY(-8px);box-shadow:inset 0 0 0 2px var(--card), inset 0 0 0 3px rgba(201,163,90,.75), 0 0 0 3px var(--gold-2), 0 0 18px rgba(241,207,134,.5), 2px 8px 12px rgba(0,0,0,.45)}
.hand .card.dim{opacity:.5;filter:saturate(.6)}
.hand .card:disabled{cursor:default}
.hand .card.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* me */
.me{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px}
.me.is-turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 26px rgba(241,207,134,.25),0 10px 24px rgba(0,0,0,.35)}
.me-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.me-head .who{font-weight:700;font-size:1.05rem}
.stat{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-size:1.05rem}
.hand{display:flex;flex-wrap:wrap;gap:12px 6px;padding-top:8px;min-height:96px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid rgba(0,0,0,.2);border-radius:9px;padding:10px 16px;font-weight:700;font-size:.95rem;background:linear-gradient(180deg,#fffaf0,#efe2c6);color:var(--card-ink);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink);border-color:#a97a2a}
.btn.red{background:linear-gradient(180deg,#d65450,#a8322f);color:#fff;border-color:#7f2523}
.btn.line{background:rgba(0,0,0,.2);color:var(--ink);border:1px solid var(--mat-edge);box-shadow:none}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.38;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.suits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.suit-btn{border:1px solid #c9a35a;border-radius:10px;background:radial-gradient(120% 90% at 50% 50%, var(--card) 55%, var(--card-2));color:var(--card-ink);font-size:2rem;padding:10px 0;font-weight:700;box-shadow:inset 0 0 0 2px var(--card), inset 0 0 0 3px rgba(201,163,90,.6)}
.suit-btn.red{color:var(--red)}
.suit-btn small{display:block;font-size:.72rem;color:var(--card-ink);opacity:.7}

.log{list-style:none;margin:0;padding:0 2px;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-height:4.6em}
.log li:first-child{color:var(--ink);font-weight:500}

details.rules{border-top:1px solid var(--line);padding-top:10px;font-size:.88rem;color:var(--muted)}
details.rules summary{cursor:pointer;color:var(--gold-2);font-weight:700}
details.rules h3{font-size:.85rem;color:var(--ink);margin:.9em 0 .2em}
details.rules ul{padding-left:1.2em;margin:.4em 0;display:flex;flex-direction:column;gap:4px;max-width:65ch}
details.rules b{color:var(--ink)}

/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(12,6,2,.7);display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.panel{border:1px solid var(--gold);border-radius:14px;padding:18px;width:100%;max-width:580px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(90% 60% at 50% 0%, rgba(255,214,150,.12), rgba(0,0,0,0) 70%), linear-gradient(180deg, #3f2717, #2a190e);
  box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 0 0 4px rgba(0,0,0,.2)}
.panel h2{font-family:var(--f-display);font-weight:800;font-size:1.35rem;margin:0;text-wrap:balance;color:var(--gold-2)}
.panel p{margin:0}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:.75rem}
td:first-child,th:first-child{text-align:left}
td.cards{text-align:left;white-space:normal;min-width:7em}
.mini-c{display:inline-block;margin:0 3px 3px 0;font-weight:700;background:var(--card);color:var(--card-ink);border:1px solid #c9a35a;border-radius:3px;padding:0 3px;font-family:var(--f-card);font-size:.8rem}
.mini-c.red{color:var(--red)}
.note{display:block;font-size:.72rem;color:var(--gold-2)}
.win{color:var(--gold-2);font-weight:700}
.rank1 td{color:var(--gold-2);font-weight:700}
.vs{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.big-num{font-family:var(--f-card);font-weight:700;font-size:1.7rem;color:var(--gold-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:linear-gradient(180deg,#fffaf0,#efe2c6);color:var(--card-ink);border:1px solid var(--gold);border-radius:9px;padding:8px 14px;font-weight:700;font-size:.88rem;max-width:calc(100% - 32px);box-shadow:0 8px 20px rgba(0,0,0,.45)}

/* records */
.rec{border-radius:12px;border:1px solid var(--mat-edge);background:var(--mat);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.rec summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.rec summary::-webkit-details-marker{display:none}
.rec[open] summary{border-bottom:1px solid var(--line)}
.rec-head{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px}
.rec-tags{display:flex;gap:6px;flex-wrap:wrap}
.rec-res{font-family:var(--f-display);font-weight:800;font-size:1.1rem;color:var(--gold-2)}
.rec-res small{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted);margin-left:6px}
.bars{display:flex;align-items:flex-end;gap:3px;height:38px;flex:0 0 auto}
.bars i{display:block;width:9px;border-radius:2px 2px 0 0;background:rgba(247,236,214,.35)}
.bars i.w{background:linear-gradient(180deg,var(--gold-2),var(--gold))}
.bars i.l{background:#d06a5f}
.rec-body{padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px}
.rec-body td.res{text-align:left;white-space:normal;min-width:9em}
.rec-players{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted)}
.rec-players b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){
  .board{grid-template-columns:auto auto;}
  .board .info{grid-column:1/-1}
  .modes{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}

<li>4人対戦。1人5枚配り、場の<b>マークか数字が同じ</b>カードを1枚出します。</li>
<li>出せない・出したくないときは山札から1枚引き、引いた後に出せるなら出してもOK、出さないならパス。</li>

<li>最初に手札を出し切った人の上がり（0点）。</li></ul>
<h3>特殊カード</h3><ul>
<li><b>3：マーク替え</b>　いつでも出せて、次のマークを好きに指定できます。</li>

const LANG_KEY = 'pageone-lang';
let lang = (() => {
  let v = null;
  try{ v = localStorage.getItem(LANG_KEY); }catch(e){}
  if(T[v]) return v;
  const n = (navigator.language || 'ja').slice(0,2).toLowerCase();
  return T[n] ? n : 'ja';
})();
function t(k, ...a){
  const v = (T[lang] && k in T[lang]) ? T[lang][k] : T.ja[k];
  return typeof v === 'function' ? v(...a) : v;
}

/* =========================================================
   定数・ユーティリティ
   ========================================================= */
const SUITS = ['♠','♥','♦','♣'];
const LOCAL_KEY = 'pageone-local-v3';
const NAME_KEY = 'pageone-name';
const SCHEMA = 3;
const IDLE_MS = 60000;
const HAND_SIZE = 5;          // 初手の枚数
// claude.ai の Artifact の外で開いたとき（オンライン対戦は使えないので隠す）
const STANDALONE = !(window.claude && typeof window.claude.use === 'function');
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

const label = r => ({1:'A',11:'J',12:'Q',13:'K'}[r] || String(r));
const colorOf = s => (s === '♥' || s === '♦') ? 'red' : 'black';
const isRed = c => colorOf(c.s) === 'red';
const cname = c => c.s + label(c.r);
const tallyVal = c => c.r >= 11 ? 10 : c.r;
const handSum = h => h.reduce((a, c) => a + c.r, 0);
const sortHand = h => h.sort((a, b) => SUITS.indexOf(a.s) - SUITS.indexOf(b.s) || a.r - b.r);
// 攻撃に使える値：数字そのもの。A・2・3だけは10倍（10・20・30）も可
const attackVals = c => c.r <= 3 ? [c.r, c.r*10] : [c.r];
// 手札の合計としてありうる値：手札のA・2・3はそれぞれ1倍か10倍かを選べる
function handTotals(h){
  let set = new Set([0]);
  for(const c of h){
    const opts = c.r <= 3 ? [c.r, c.r*10] : [c.r];
    const next = new Set();
    set.forEach(v => opts.forEach(o => next.add(v + o)));
    set = next;
  }
  return [...set].sort((a,b) => a-b);
}
// 出されたカードに対して攻撃できる値（なければ null）
function matchVal(h, card){
  if(!h.length) return null;
  const tot = handTotals(h);
  const v = attackVals(card).find(x => tot.includes(x));
  return v === undefined ? null : v;
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function newDeck(){ const d=[]; for(const s of SUITS) for(let r=1;r<=13;r++) d.push({s,r}); return shuffle(d); }

const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* 席の表示名（CPUは表示言語の名前） */
function seatName(s, i){
  const x = s && s.seats[i];
  if(!x) return '?';
  if(x.cpu) return x.name ? `${x.name} (CPU)` : t('cpuNames')[(x.cpuIdx ?? i) % 4];
  return x.name || '?';
}

/* =========================================================
   ルールエンジン（状態 s を直接変更する。CPU戦・オンライン共通）
   ログと結果は言語に依存しない形 {k, a} で保存し、表示時に翻訳する
   ========================================================= */
const stepS = (s,i,n=1) => (((i + s.r.dir*n) % 4) + 4) % 4;
const topOf = r => r.pile[r.pile.length-1];
function canPlayR(r, c){
  const top = topOf(r);
  if(!top) return false;
  if(r.pending > 0) return c.r === 2;
  return c.r === 3 || c.s === r.topSuit || c.r === top.r;
}
const canDrawR = r => r.deck.length > 0 || r.pile.length > 1;
function lg(s, k, a){ s.r.log.unshift({k, a: a || {}}); s.r.log = s.r.log.slice(0,6); }
function drawR(s){
  const r = s.r;
  if(!r.deck.length && r.pile.length > 1){
    const top = r.pile.pop(); r.deck = shuffle(r.pile); r.pile = [top];
    lg(s,'shuffle');
  }
  return r.deck.pop() || null;
}

function startRound(s){
  const deck = newDeck();
  const hands = [[],[],[],[]];
  for(let k=0;k<HAND_SIZE;k++) for(let i=0;i<4;i++) hands[i].push(deck.pop());
  hands.forEach(sortHand);
  const first = deck.pop();
  s.r = {deck, pile:[first], hands, turn:(s.game-1)%4, dir:1, topSuit:first.s,
         pending:0, skip:false, passes:0, drew:false, phase:'play', atk:null, ctr:null, result:null, log:[], turnNo:0,
         st:[0,1,2,3].map(() => ({plays:0, threes:0, stacks:0, draws:0, atkCh:0, declAtk:0, ctrCh:0, declCtr:0, pen:0}))};
  lg(s, 'start', {g:s.game, w:s.r.turn, l:s.game===10});
}
// 称号のための行動記録
function bump(s, i, k){ const st = s.r.st; if(st && st[i]) st[i][k] = (st[i][k] || 0) + 1; }

function applyPlayR(s, i, c, suit){
  const r = s.r, h = r.hands[i];
  h.splice(h.findIndex(x => x.s===c.s && x.r===c.r), 1);
  const prev = r.topSuit;
  r.pile.push(c); r.topSuit = c.s;
  const fx = [];
  if(colorOf(c.s) !== colorOf(prev)){ r.dir *= -1; fx.push({k:'rev'}); }
  if(c.r === 2){ r.pending += 2; fx.push({k:'d2', n:r.pending}); }
  if(c.r === 1){ r.skip = true; fx.push({k:'skip'}); }
  if(c.r === 3 && suit){ r.topSuit = suit; fx.push({k:'suit', s:suit}); }
  return fx;
}

function advanceTurn(s, from, n){
  const r = s.r;
  r.turn = stepS(s, from, n);
  r.drew = false; r.turnNo++;
}

function actPlay(s, i, idx, suit, declared){
  const r = s.r;
  if(s.status !== 'playing' || r.phase !== 'play' || r.turn !== i) return false;
  const c = r.hands[i][idx];
  if(!c || !canPlayR(r, c)) return false;
  if(c.r === 3 && r.hands[i].length > 1){ if(!SUITS.includes(suit)) return false; }
  else suit = null;
  bump(s, i, 'plays');
  if(c.r === 3) bump(s, i, 'threes');
  if(c.r === 2 && r.pending > 0) bump(s, i, 'stacks');
  const fx = applyPlayR(s, i, c, suit);
  const left = r.hands[i].length;
  lg(s, 'play', {w:i, c, fx, p1: left===1 && !!declared});
  if(left === 1 && !declared){
    const got = [drawR(s), drawR(s)].filter(Boolean);
    r.hands[i].push(...got); sortHand(r.hands[i]);
    bump(s, i, 'pen');
    lg(s, 'penalty', {w:i, n:got.length});
  }
  afterPlay(s, i, c);
  return true;
}

function afterPlay(s, i, c){
  const r = s.r;
  r.passes = 0;
  if(!r.hands[i].length){ endRound(s, {winner:i}); return; }
  const queue = [];
  for(let k=1;k<4;k++){
    const j = stepS(s, i, k);
    if(matchVal(r.hands[j], c) !== null) queue.push(j);
  }
  r.atk = {d:i, card:c, queue};
  advanceAttack(s);
}

function advanceAttack(s){
  const r = s.r, a = r.atk;
  if(a && a.queue.length){
    const j = a.queue[0];
    if(s.seats[j].cpu){
      // 強さによっては攻撃を見逃す
      if(Math.random() < lvOf(s).missAtk){ a.queue.shift(); advanceAttack(s); return; }
      lg(s, 'atk', {w:j, n:matchVal(r.hands[j], a.card)});
      resolveAttack(s, j, a.d, a.card);
      return;
    }
    if(a.asked !== j){ bump(s, j, 'atkCh'); a.asked = j; }
    r.phase = 'attack';
    return;
  }
  const d = a ? a.d : r.turn;
  r.atk = null; r.phase = 'play';
  const n = r.skip ? 2 : 1;
  if(r.skip) lg(s, 'skipped', {w:stepS(s,d,1)});
  r.skip = false;
  advanceTurn(s, d, n);
}

function actAttack(s, i, yes){
  const r = s.r;
  if(s.status !== 'playing' || r.phase !== 'attack' || !r.atk || r.atk.queue[0] !== i) return false;
  if(yes){
    lg(s, 'atk', {w:i, n:matchVal(r.hands[i], r.atk.card)});
    resolveAttack(s, i, r.atk.d, r.atk.card);
  } else {
    lg(s, 'noAtk', {w:i});
    bump(s, i, 'declAtk');
    r.atk.queue.shift();
    advanceAttack(s);
  }
  return true;
}

/* 攻撃が決まったあと：攻撃された人の手札合計も当てられた数字と同じなら当て返しの判断へ */
function resolveAttack(s, j, d, card){
  const r = s.r, val = matchVal(r.hands[j], card);
  if(r.hands[d].length && handTotals(r.hands[d]).includes(val)){
    if(s.seats[d].cpu){
      const yes = Math.random() >= lvOf(s).missCtr;
      if(yes) lg(s, 'ctr', {w:d, n:val});
      endRound(s, {attacker:j, attacked:d, card, val, counter:yes});
      return;
    }
    r.atk = null;
    r.ctr = {attacker:j, d, card, val};
    r.phase = 'counter';
    bump(s, d, 'ctrCh');
    return;
  }
  endRound(s, {attacker:j, attacked:d, card, val});
}

function actCounter(s, i, yes){
  const r = s.r;
  if(s.status !== 'playing' || r.phase !== 'counter' || !r.ctr || r.ctr.d !== i) return false;
  const c = r.ctr;
  lg(s, yes ? 'ctr' : 'noCtr', {w:i, n:c.val});
  if(!yes) bump(s, i, 'declCtr');
  endRound(s, {attacker:c.attacker, attacked:c.d, card:c.card, val:c.val, counter:!!yes});
  return true;
}

function actDraw(s, i){
  const r = s.r;
  if(s.status !== 'playing' || r.phase !== 'play' || r.turn !== i) return false;
  bump(s, i, 'draws');
  if(r.pending > 0){
    const want = r.pending; let n = 0;
    for(let k=0;k<want;k++){ const c = drawR(s); if(!c) break; r.hands[i].push(c); n++; }
    sortHand(r.hands[i]);
    r.pending = 0; r.passes = 0;
    lg(s, 'took', {w:i, n, short:n<want});
    advanceTurn(s, i, 1);
    return true;
  }
  if(r.drew) return false;
  const c = drawR(s);
  r.drew = true;
  if(!c){ lg(s, 'noDeck', {w:i}); return true; }
  r.hands[i].push(c); sortHand(r.hands[i]);
  lg(s, 'drew', {w:i});
  return true;
}

function actPass(s, i){
  const r = s.r;
  if(s.status !== 'playing' || r.phase !== 'play' || r.turn !== i || r.pending > 0) return false;
  if(!(r.drew || !canDrawR(r))) return false;
  lg(s, 'pass', {w:i});
  r.passes++;
  if(r.passes >= 4 && !canDrawR(r)){ endRound(s, {draw:true}); return true; }
  advanceTurn(s, i, 1);
  return true;
}

/* CPUの強さ：見逃し・宣言忘れの確率 */
const LEVELS = {
  easy:   {missAtk:0.5,  missCtr:0.5,  forget:0.3,  noStack:0.5},
  normal: {missAtk:0.25, missCtr:0.25, forget:0.12, noStack:0.2},
  hard:   {missAtk:0,    missCtr:0,    forget:0,    noStack:0}
};
const lvOf = s => LEVELS[s.level] || LEVELS.hard;

function cpuChoose(s, i){
  const r = s.r, h = r.hands[i];
  const ok = h.filter(c => canPlayR(r, c));
  if(!ok.length) return null;
  // やさしい：ほぼでたらめに出す
  if(s.level === 'easy') return ok[Math.floor(Math.random()*ok.length)];
  const nextLow = s.level !== 'normal' && r.hands[stepS(s,i,1)].length <= 2;
  const noise = s.level === 'normal' ? 9 : 2;
  let best = null, bs = -Infinity;
  for(const c of ok){
    // 2は倍率がかかるので早めに処分、点の高いカードを優先、3（ワイルド）は温存
    let sc = tallyVal(c) + Math.random()*noise;
    if(c.r === 2) sc += 30;
    if(c.r === 3 && ok.length > 1) sc -= 8;
    if(nextLow && (c.r === 1 || c.r === 2)) sc += 15;
    if(sc > bs){ bs = sc; best = c; }
  }
  return best;
}
function cpuSuit(h, except){
  const cnt = {}; SUITS.forEach(x => cnt[x] = 0);
  h.forEach(c => { if(c !== except && c.r !== 3) cnt[c.s] += 1 + tallyVal(c)/20; });
  return SUITS.slice().sort((a,b) => cnt[b]-cnt[a])[0];
}
function cpuPlayCard(s, i, c){
  const h = s.r.hands[i];
  const idx = h.findIndex(x => x.s===c.s && x.r===c.r);
  const suit = c.r === 3 && h.length > 1 ? (s.level === 'easy' ? SUITS[Math.floor(Math.random()*4)] : cpuSuit(h, h[idx])) : null;
  const declared = !(h.length === 2 && Math.random() < lvOf(s).forget);
  return actPlay(s, i, idx, suit, declared);
}
function cpuAct(s){
  const r = s.r;
  if(s.status !== 'playing' || r.phase !== 'play') return false;
  const i = r.turn;
  if(!s.seats[i].cpu) return false;
  if(r.pending > 0){
    const two = r.hands[i].find(c => c.r === 2);
    return (two && Math.random() >= lvOf(s).noStack) ? cpuPlayCard(s, i, two) : actDraw(s, i);
  }
  const pick = cpuChoose(s, i);
  if(pick) return cpuPlayCard(s, i, pick);
  const before = r.hands[i].length;
  actDraw(s, i);
  if(r.hands[i].length > before){
    const again = cpuChoose(s, i);
    if(again) return cpuPlayCard(s, i, again);
  }
  return actPass(s, i);
}

function endRound(s, info){
  const r = s.r;
  // 当て返し成立時は勝ち負けが入れ替わる
  const winSeat = info.counter ? info.attacked : info.attacker;
  const loseSeat = info.counter ? info.attacker : info.attacked;
  const rows = s.seats.map((seat, i) => {
    const hand = r.hands[i];
    const tally = hand.reduce((a,c) => a + tallyVal(c), 0);
    const twos = hand.filter(c => c.r === 2).length;
    const win = info.winner === i || (winSeat !== undefined && winSeat === i);
    let mult = 1, add = 0; const notes = [];
    if(!win){
      if(info.counter && loseSeat === i){ add = info.val; notes.push({k:'hit', n:info.val}); }
      if(twos){ mult *= 2**twos; notes.push({k:'twos', n:twos, x:2**twos}); }
      if(loseSeat === i){ mult *= 2; notes.push({k: info.counter ? 'ctr' : 'atk'}); }
      if(s.game === 10){ mult *= 2; notes.push({k:'final'}); }
    }
    const base = tally + add;
    // 称号用：この人のゲームの終わり方
    let res = 'none';
    if(info.winner === i) res = 'out';
    else if(win) res = info.counter ? 'ctrWin' : 'atkWin';
    else if(loseSeat === i) res = info.counter ? 'ctrLoss' : 'atkLoss';
    else if(info.draw) res = 'drawGame';
    return {i, hand:[...hand], base, mult, notes, score: win ? 0 : base*mult, win,
            res, cards:hand.length, end2s:twos, st:(r.st && r.st[i]) ? {...r.st[i]} : null};
  });
  rows.forEach(x => s.totals[x.i] += x.score);
  s.history.push({game:s.game, scores:rows.map(x => x.score)});
  let kind = 'draw';
  if(info.winner !== undefined) kind = 'out';
  else if(info.counter) kind = 'counter';
  else if(info.attacker !== undefined) kind = 'attack';
  r.result = {kind, winner:info.winner ?? null, attacker:info.attacker ?? null, attacked:info.attacked ?? null, card:info.card || null, val:info.val || 0, rows};
  r.phase = 'result'; r.atk = null; r.ctr = null;
  lg(s, 'end', {g:s.game});
}

function actNext(s, game){
  if(s.status !== 'playing' || !s.r || s.r.phase !== 'result' || s.game !== game) return false;
  if(s.game >= 10){ s.status = 'done'; s.r.phase = 'final'; return true; }
  s.game++;
  startRound(s);
  return true;
}

function seatToCpu(s, i){
  const seat = s.seats[i];
  seat.cpu = true; seat.uid = null; seat.cpuIdx = i;
  if(!s.r) return;
  if(s.r.phase === 'attack' && s.r.atk && s.r.atk.queue[0] === i) advanceAttack(s);
  else if(s.r.phase === 'counter' && s.r.ctr && s.r.ctr.d === i) actCounter(s, i, true);
}

/* ---------- 表示用の翻訳 ---------- */
function headText(s, res){
  if(!res) return '';
  if(res.kind === 'out') return t('headOut', seatName(s,res.winner));
  if(res.kind === 'attack') return t('headAtk', seatName(s,res.attacker), seatName(s,res.attacked));
  if(res.kind === 'counter') return t('headCtr', seatName(s,res.attacked), seatName(s,res.attacker));
  return t('headDraw');
}
function extraText(s, res){
  if(!res || !res.card) return '';
  let x = `${cname(res.card)} (${attackVals(res.card).join(' / ')}) = ${t('handOf', seatName(s,res.attacker))} ${res.val}`;
  if(res.kind === 'counter') x += ` = ${t('handOf', seatName(s,res.attacked))} ${res.val}`;
  return x;
}
function noteText(n){
  if(n.k === 'hit') return t('nHit', n.n);
  if(n.k === 'twos') return t('nTwos', n.n, n.x);
  if(n.k === 'atk') return t('nAtk');
  if(n.k === 'ctr') return t('nCtr');
  if(n.k === 'final') return t('nFinal');
  return '';
}
function fxText(f){
  if(f.k === 'rev') return t('fxRev');
  if(f.k === 'skip') return t('fxSkip');
  if(f.k === 'd2') return t('fxD2', f.n);
  if(f.k === 'suit') return t('fxSuit', f.s);
  return '';
}
function logText(s, e){
  if(typeof e === 'string') return e;
  const a = e.a || {}, w = a.w !== undefined ? seatName(s, a.w) : '';
  switch(e.k){
    case 'start': return t('lStart', a.g, w, a.l);
    case 'shuffle': return t('lShuffle');
    case 'play': return t('lPlay', w, cname(a.c), (a.fx||[]).map(fxText).join(t('fxSep')), a.p1);
    case 'penalty': return t('lPenalty', w, a.n);
    case 'atk': return t('lAtk', w, a.n);
    case 'ctr': return t('lCtr', w, a.n);
    case 'noCtr': return t('lNoCtr', w);
    case 'noAtk': return t('lNoAtk', w);
    case 'skipped': return t('lSkipped', w);
    case 'took': return t('lTook', w, a.n, a.short);
    case 'drew': return t('lDrew', w);
    case 'noDeck': return t('lNoDeck', w);
    case 'pass': return t('lPass', w);
    case 'end': return t('lEnd', a.g, headText(s, s.r && s.r.result));
  }
  return '';
}

  'plays','threes','stacks','draws','atkCh','declAtk','ctrCh','declCtr','pen','matches','matchWins'];

  return {st:emptyStats(), counted:[]};
})();
const titleCache = {};   // 他のプレイヤーの称号 {uid: key}
const titleLoading = {};

function titleOf(st){
  if(!st || (st.games||0) < 3) return 'rookie';
  const g = st.games, avg = st.pts / g;
  const sc = {
    cunning: (st.atkWin + st.ctrWin) / g / 0.15,
    straight: st.out / g / 0.3,
    gambler: Math.max(st.end2s / g / 0.6, st.stacks / g / 0.3),
    cautious: (avg <= 10 && st.atkLoss / g <= 0.05) ? 1 + (10 - avg) / 20 : 0,
    innocent: Math.max(st.atkCh ? st.declAtk / st.atkCh / 0.5 : 0, st.atkLoss / g / 0.2),
    tycoon: st.cards / g / HAND_SIZE,
    clumsy: st.pen / g / 0.3,
    magician: st.plays ? st.threes / st.plays / 0.15 : 0
  };
  let best = 'allround', bv = 1;
  for(const k in sc){ if(sc[k] > bv){ bv = sc[k]; best = k; } }
  return best;
}
function favWin(st){
  const c = [['wOut', st.out], ['wAtk', st.atkWin], ['wCtr', st.ctrWin]].sort((a,b) => b[1]-a[1]);
  return c[0][1] > 0 ? t(c[0][0]) : t('wNone');
}

  const st = myStats.st, key = titleOf(st);
  $('#myTitle').textContent = t('titles')[key];
  $('#myTitleDesc').textContent = t('tdesc')[key];

  const rows = [

    [t('sRate'), st.games ? Math.round(st.wins / st.games * 100) + '%' : '—'],
    [t('sWL'), `${st.wins}-${losses}`],
    [t('sAvg'), st.games ? (st.pts / st.games).toFixed(1) : '—'],
    [t('sFav'), favWin(st)],
    [t('sMatch'), `${st.matchWins} / ${st.matches}`]
  ];
  $('#myStats').innerHTML = rows.map(([k,v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');
}

/* 終わったゲームを自分の成績に加える（同じゲームを二重に数えない） */
function recordStats(){
  const s = S;
  if(!s || !s.r || mySeat < 0) return;
  const base = mode === 'local' ? 'L' + (s.id || 'x') : 'O' + s.code + (s.createdAt || '');
  let changed = false;
  const st = myStats.st;
  if((s.r.phase === 'result' || s.r.phase === 'final') && s.r.result){
    const key = base + ':' + s.game;
    const row = s.r.result.rows[mySeat];
    if(row && !myStats.counted.includes(key)){
      myStats.counted.push(key);
      logGame(base, s, row);
      st.games++; if(row.win) st.wins++;
      if(row.res && st[row.res] !== undefined) st[row.res]++;
      st.pts += row.score; st.cards += row.cards || 0; st.end2s += row.end2s || 0;
      if(row.st) ['plays','threes','stacks','draws','atkCh','declAtk','ctrCh','declCtr','pen'].forEach(k => st[k] += row.st[k] || 0);
      changed = true;
    }
  }
  if(s.status === 'done'){
    const key = base + ':F';
    if(!myStats.counted.includes(key)){
      myStats.counted.push(key);
      st.matches++;
      if(s.totals[mySeat] === Math.min(...s.totals)) st.matchWins++;
      logDone(base, s);
      changed = true;
    }
  }
  if(!changed) return;
  myStats.counted = myStats.counted.slice(-60);
  saveStats();
}

/* =========================================================
   対戦の記録（十番勝負ごと・1戦ごと）
   ========================================================= */
const HIST_KEY = 'pageone-history';
const HIST_MAX = 30;
let myHistory = (() => {
  try{ const d = JSON.parse(localStorage.getItem(HIST_KEY) || 'null'); if(d && Array.isArray(d.matches)) return d; }catch(e){}
  return {matches:[]};
})();
function histEntry(base, s){
  let m = myHistory.matches.find(x => x.key === base);
  if(!m){
    m = {key:base, mode: mode === 'local' ? 'local' : 'online', code:s.code || '', level:s.level || 'hard', at:Date.now(),
         seats:s.seats.map((x,i) => ({name:x.name, cpu:!!x.cpu, cpuIdx:x.cpuIdx ?? i})), me:mySeat, games:[], totals:[0,0,0,0], done:false};
    myHistory.matches.unshift(m);
    myHistory.matches = myHistory.matches.slice(0, HIST_MAX);
  }
  return m;
}
function logGame(base, s, row){
  const m = histEntry(base, s), res = s.r.result;
  if(m.games.some(g => g.g === s.game)) return;
  m.seats = s.seats.map((x,i) => ({name:x.name, cpu:!!x.cpu, cpuIdx:x.cpuIdx ?? i}));
  m.games.push({g:s.game, kind:res.kind, winner:res.winner, attacker:res.attacker, attacked:res.attacked,
    card:res.card, val:res.val, score:row.score, mult:row.mult, base:row.base, win:row.win, res:row.res,
    notes:row.notes, hand:row.hand, scores:res.rows.map(x => x.score)});
  m.totals = [...s.totals];
  saveHistory();
}
function logDone(base, s){
  const m = histEntry(base, s);
  m.done = true; m.totals = [...s.totals];
  saveHistory();
}
let histWrite = Promise.resolve();
function saveHistory(){
  ls.set(HIST_KEY, JSON.stringify(myHistory));
  if(!db || !uid || connState !== 'ready') return;
  const body = {v:SCHEMA, matches:myHistory.matches, updatedAt:Date.now()};
  histWrite = histWrite.then(() => db.doc('data/users/' + uid + '/log').set(body)).catch(() => {});
}
async function loadRemoteHistory(){
  try{
    const snap = await db.doc('data/users/' + uid + '/log').get();
    if(!snap.exists) return;
    const d = snap.data();
    if(!d || !Array.isArray(d.matches)) return;
    const byKey = {};
    [...d.matches, ...myHistory.matches].forEach(m => {
      const cur = byKey[m.key];
      if(!cur || (m.games||[]).length > (cur.games||[]).length || (m.done && !cur.done)) byKey[m.key] = m;
    });
    myHistory.matches = Object.values(byKey).sort((a,b) => b.at - a.at).slice(0, HIST_MAX);
    ls.set(HIST_KEY, JSON.stringify(myHistory));
    if(current === 'records') renderRecords();
  }catch(e){}
}

/* ---------- 状態の更新 ---------- */
async function mutate(fn){
  if(mode === 'local'){
    const s = clone(S);
    if(fn(s) === false) return false;
    s.rev = (S.rev||0) + 1; s.updatedAt = Date.now();
    S = s;
    ls.set(LOCAL_KEY, JSON.stringify(S));
    onState();
    return true;
  }
  if(mode !== 'online' || !code) return false;
  const ref = db.doc('tables/' + code);
  busy = true; renderGameButtons();
  try{
    for(let k=0;k<8;k++){
      let lease;
      try{ lease = await ref.acquire({holder: uid + ':' + tabId, ttlMs:1200}); }
      catch(e){ await sleep(400); continue; }
      if(!lease.acquired){ await sleep(250 + Math.random()*350); continue; }
      const snap = await ref.get();
      if(!snap.exists) return false;
      const s = clone(snap.data());
      if(fn(s) === false) return false;
      s.rev = (s.rev||0) + 1; s.updatedAt = Date.now();
      await ref.set(s);
      S = s; onState();
      return true;
    }
    toast(t('busyNet'));
    return false;
  }catch(e){
    toast(e && e.code === 'invalid_argument' ? t('noPerm') : t('netFail'));
    return false;
  }finally{
    busy = false; renderGameButtons();
  }
}

function onState(){
  if(!S) return;
  if(mode === 'online'){
    mySeat = S.seats.findIndex(x => !x.cpu && x.uid === uid);
    if(S.status === 'closed'){ toast(t('closed')); goLobby(); return; }
    if(S.status === 'lobby'){ show('room'); renderRoom(); return; }
    if(mySeat < 0){ toast(t('noSeat')); goLobby(); return; }
  }
  if(current !== 'game'){ show('game'); window.scrollTo(0,0); }
  recordStats();
  fetchTitles(S);
  renderGame();
  renderOverlay();
  scheduleDriver();
}

/* ---------- CPUの進行 ---------- */
let driverTimer = null, driverRev = null;
function scheduleDriver(){
  const s = S;
  if(!s || s.status !== 'playing' || !s.r) return;
  if(driverRev === s.rev) return;
  driverRev = s.rev; clearTimeout(driverTimer);
  if(s.r.phase !== 'play' || !s.seats[s.r.turn].cpu) return;
  const lead = mode === 'local' || s.host === uid;
  const delay = lead ? 850 : 6000 + Math.random()*2500;
  const rev = s.rev, m = mode, c = code;
  driverTimer = setTimeout(() => {
    if(mode !== m || code !== c) return;
    mutate(x => x.rev === rev && cpuAct(x));
  }, delay);
}

async function joinTable(c){
  if(needName()) return;
  mode = 'online'; code = c;
  const ok = await mutate(s => {
    if(s.seats.some(x => !x.cpu && x.uid === uid)){
      s.seats.forEach(x => { if(!x.cpu && x.uid === uid) x.name = myName; });
      return true;
    }
    if(s.status !== 'lobby') return false;
    const k = s.seats.findIndex(x => !x.cpu && !x.uid);
    if(k < 0) return false;
    s.seats[k] = {uid, name:myName, cpu:false};
    return true;
  });
  if(!ok){ mode = null; code = null; toast(t('cantJoin')); return; }
  openTable(c);
}

function openTable(c){
  stopLobby(); stopTable();
  mode = 'online'; code = c; driverRev = null; S = null;
  unsubTable = db.doc('tables/' + c).onSnapshot(
    snap => {
      if(mode !== 'online' || code !== c) return;
      if(!snap.exists){ toast(t('notFound')); goLobby(); return; }
      const d = snap.data();
      if(S && S.rev > d.rev && !snap.metadata.hasPendingWrites) return;
      S = clone(d);
      onState();
    },
    () => { toast(t('disconnected')); goLobby(); }
  );
}

/* ---------- 待合室 ---------- */
function renderRoom(){
  const s = S;
  $('#roomCode').textContent = s.code;
  const isHost = s.host === uid;
  $('#roomSeats').innerHTML = s.seats.map((x,i) => {
    if(x.cpu || x.uid) return `<div class="seatbox filled"><b>${esc(seatName(s,i))}</b><small>${x.uid === s.host ? t('hostTag') : x.cpu ? t('cpuTag') : t('playerTag')}${x.uid === uid ? t('youTag') : ''}</small></div>`;
    return `<div class="seatbox"><small>${t('emptySeat', i+1)}</small><span class="hint">${t('emptyHint')}</span></div>`;
  }).join('');
  const humans = s.seats.filter(x => !x.cpu && x.uid).length;
  $('#roomHint').textContent = isHost ? t('roomHost', humans, s.code) : t('roomWait');
  const lv = LEVELS[s.level] ? s.level : 'hard';
  $('#roomActions').innerHTML = `<div style="flex:1 1 100%;display:flex;flex-direction:column;gap:6px">
      <span class="hint">${t('lvRoom')}</span>
      <div class="seg" id="roomLv">${['easy','normal','hard'].map(x => `<button type="button" data-rlv="${x}" aria-pressed="${x===lv}" ${isHost?'':'disabled'}>${lvName(x)}</button>`).join('')}</div>
    </div>` + (isHost ? `<button class="btn gold" type="button" id="startBtn">${t('startBtn')}</button>` : '');
  $('#roomLv').onclick = e => {
    const b = e.target.closest('[data-rlv]'); if(!b || !isHost) return;
    const nv = b.dataset.rlv;
    mutate(x => { if(x.status !== 'lobby' || x.host !== uid) return false; x.level = nv; return true; });
  };
  const sb = $('#startBtn');
  if(sb) sb.onclick = () => mutate(x => {
    if(x.status !== 'lobby' || x.host !== uid) return false;
    x.seats.forEach((st,i) => { if(!st.cpu && !st.uid) x.seats[i] = {uid:null, name:'', cpu:true, cpuIdx:i}; });
    x.status = 'playing'; x.game = 1; x.totals = [0,0,0,0]; x.history = [];
    startRound(x);
    return true;
  });
}
$('#roomLeave').addEventListener('click', () => leaveTable());

async function leaveTable(){
  if(mode !== 'online' || !code) return;
  await mutate(s => {
    const i = s.seats.findIndex(x => !x.cpu && x.uid === uid);
    if(i < 0) return false;
    if(s.status === 'lobby') s.seats[i] = {uid:null, name:'', cpu:false};
    else if(s.status === 'playing') seatToCpu(s, i);
    else return false;
    if(s.host === uid){
      const h = s.seats.find(x => !x.cpu && x.uid);
      s.host = h ? h.uid : null;
    }
    if(!s.seats.some(x => !x.cpu && x.uid)) s.status = 'closed';
    return true;
  });
  goLobby();
}

/* ---------- 最近の結果 ---------- */
async function loadRecent(){
  try{
    const snap = await db.collection('results').orderBy('at','desc').limit(5).get();
    recentRows = snap.docs.map(d => d.data()).filter(x => x && x.v === SCHEMA);
  }catch(e){ recentRows = []; }
  renderRecent();
}
function renderRecent(){
  $('#recentBox').hidden = !recentRows.length;
  $('#recentList').innerHTML = recentRows.map(r => {
    const d = new Date(r.at);
    const fake = {seats:(r.players||[]).map(q => ({name:q.name, cpu:q.cpu, cpuIdx:q.cpuIdx}))};
    const ps = (r.players||[]).map((p,i) => ({total:p.total, label:seatName(fake, i)})).sort((a,b) => a.total-b.total);
    return `<li class="tbl"><div class="who"><span class="tag">${d.getMonth()+1}/${d.getDate()}</span>
      ${t('champ')} <b>${esc(ps[0] ? ps[0].label : '')}</b>　${ps.map(p => `${esc(p.label)} ${p.total}`).join(' / ')}</div></li>`;
  }).join('');
}
async function saveResult(s){
  try{
    await db.doc('results/' + s.code + '-' + s.createdAt).set({
      v:SCHEMA, at: Date.now(), code: s.code,
      players: s.seats.map((x,i) => ({name:x.name, cpu:!!x.cpu, cpuIdx:x.cpuIdx ?? i, total:s.totals[i]}))
    });
  }catch(e){}
}

/* =========================================================
   対局画面
   ========================================================= */
const EMBLEM = {11:'⚜', 12:'♛', 13:'♚'};
function cardHTML(c, withFx){
  const f = withFx && t('fx')[c.r] ? `<span class="fx">${t('fx')[c.r]}</span>` : '';
  const idx = `${label(c.r)}<small>${c.s}</small>`;
  const mid = c.r >= 11
    ? `<span class="s face"><span class="emb">${EMBLEM[c.r]}</span><span class="fs">${c.s}</span></span>`
    : `<span class="s">${c.s}</span>`;
  return `<span class="r">${idx}</span>${mid}<span class="r rb">${idx}</span>${f}`;
}
function miniHTML(c){ return `<span class="mini-c ${isRed(c)?'red':''}">${cname(c)}</span>`; }

const myTurn = () => !!(S && S.status === 'playing' && S.r && S.r.phase === 'play' && S.r.turn === mySeat);

function renderGame(){
  const s = S, r = s.r;
  if(!r) return;
  const top = topOf(r);
  $('#gameSub').textContent = mode === 'online' ? t('subOnline', s.code) : t('subLocal');
  $('#gameExit').textContent = mode === 'online' ? t('leave') : t('menu');
  $('#gameNo').textContent = t('gameNo', s.game);
  $('#lvChip').textContent = t('lvChip', lvName(LEVELS[s.level] ? s.level : 'hard'));
  $('#finalBadge').hidden = s.game !== 10;
  $('#seats').innerHTML = [1,2,3].map(k => {
    const i = (mySeat + k) % 4, n = r.hands[i].length;
    const turnHere = s.status === 'playing' && ((r.phase === 'play' && r.turn === i) || (r.phase === 'attack' && r.atk && r.atk.queue[0] === i) || (r.phase === 'counter' && r.ctr && r.ctr.d === i));
    return `<div class="seat ${turnHere ? 'is-turn':''}">
      <div class="seat-head"><span class="seat-name">${esc(seatName(s,i))}</span>${seatTitle(s,i)}${n===1?`<span class="p1">${t('p1Badge')}</span>`:''}</div>
      <div class="minis">${'<i></i>'.repeat(Math.min(n,16))}</div>
      <div class="seat-meta"><span>${t('cards', n)}</span><span>${t('seatTotal', s.totals[i])}</span></div>
    </div>`;
  }).join('');
  $('#deckCount').textContent = r.deck.length;
  $('#deckBack').classList.toggle('empty', r.deck.length === 0);
  $('#top').innerHTML = top ? `<div class="card big ${isRed(top)?'red':''}">${cardHTML(top)}</div>` : '';
  $('#line').innerHTML = top ? attackVals(top).map(v => `<b>${v}</b>`).join(` <small>${t('or')}</small> `) : '—';
  $('#status').innerHTML = top ? `<span>${t('topSuit')} <span class="suit ${colorOf(r.topSuit)==='red'?'red':''}">${r.topSuit}</span>${r.topSuit!==top.s?t('chosen'):''}</span>
    <span>${r.dir===1?t('cw'):t('ccw')}</span>
    ${r.pending ? `<span class="warn">${t('pend', r.pending)}</span>` : ''}` : '';
  $('#order').textContent = t('order') + [0,1,2,3].map(k => seatName(s, (((r.turn + r.dir*k) % 4) + 4) % 4)).join(' → ');
  let tag = '';
  if(s.status === 'playing'){
    if(r.phase === 'play') tag = r.turn === mySeat ? t('yourTurn') : t('theirTurn', seatName(s, r.turn));
    else if(r.phase === 'attack' && r.atk) tag = r.atk.queue[0] === mySeat ? t('atkChance') : t('atkThinking', seatName(s, r.atk.queue[0]));
    else if(r.phase === 'counter' && r.ctr) tag = r.ctr.d === mySeat ? t('ctrChance') : t('ctrThinking', seatName(s, r.ctr.d));
  }
  $('#turnTag').textContent = tag;
  renderIdle();
  $('#log').innerHTML = r.log.slice(0,4).map(e => `<li>${esc(logText(s, e))}</li>`).join('');

  const me = r.hands[mySeat], my = myTurn();
  if(!my) ui.declared = false;
  $('#me').classList.toggle('is-turn', my);
  $('#myName').innerHTML = `${esc(seatName(s, mySeat))} ${seatTitle(s, mySeat)}`;
  // 手札合計：A・2・3を10倍にした組み合わせもすべて表示
  $('#mySum').textContent = handTotals(me).join(' / ');
  $('#myTotal').textContent = s.totals[mySeat];
  $('#hand').innerHTML = me.map((c,i) => {
    const ok = my && canPlayR(r, c);
    return `<button type="button" class="card ${isRed(c)?'red':''} ${ok?'ok':''} ${my&&!ok?'dim':''}" data-i="${i}" ${my?'':'disabled'} aria-label="${cname(c)}">${cardHTML(c, true)}</button>`;
  }).join('');
  renderGameButtons();
}

function renderGameButtons(){
  if(!S || !S.r || current !== 'game') return;
  const r = S.r, my = myTurn() && !busy, me = r.hands[mySeat] || [];
  const db_ = $('#drawBtn');
  if(r.pending > 0 && myTurn()){ db_.textContent = t('drawN', r.pending); db_.disabled = !my; }
  else { db_.textContent = t('draw1'); db_.disabled = !my || r.drew || !canDrawR(r); }
  $('#passBtn').disabled = !my || r.pending > 0 || !(r.drew || !canDrawR(r));
  const p1 = $('#p1Btn');
  p1.disabled = !my || me.length !== 2 || ui.declared;
  p1.textContent = ui.declared && myTurn() ? t('declared') : t('p1');
  $('#hand').querySelectorAll('.card').forEach(b => { b.disabled = !my; });
}

function renderIdle(){
  const box = $('#idleBox');
  const s = S;
  if(mode !== 'online' || !s || s.status !== 'playing' || !s.r){ box.innerHTML = ''; return; }
  const r = s.r;
  let w = -1;
  if(r.phase === 'play') w = r.turn;
  else if(r.phase === 'attack' && r.atk) w = r.atk.queue[0];
  else if(r.phase === 'counter' && r.ctr) w = r.ctr.d;
  if(w < 0 || w === mySeat || s.seats[w].cpu || Date.now() - (s.updatedAt||0) < IDLE_MS){ box.innerHTML = ''; return; }
  box.innerHTML = `<button class="btn line small" type="button" id="idleBtn">${esc(t('idleBtn', seatName(s,w)))}</button>`;
  const rev = s.rev;
  $('#idleBtn').onclick = () => mutate(x => {
    if(x.rev !== rev) return false;
    seatToCpu(x, w);
    if(x.host && !x.seats.some(st => !st.cpu && st.uid === x.host)) x.host = uid;
    return true;
  });
}
setInterval(() => { if(mode === 'online' && S && S.status === 'playing' && current === 'game') renderIdle(); }, 5000);

/* ---------- 自分の操作 ---------- */
function onCardClick(i){
  if(!myTurn() || busy) return;
  const r = S.r, c = r.hands[mySeat][i];
  if(!c) return;
  if(!canPlayR(r, c)){
    toast(r.pending > 0 ? t('onlyTwos') : t('playRule'));
    const el = document.querySelector(`#hand [data-i="${i}"]`);
    if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    return;
  }
  if(c.r === 3 && r.hands[mySeat].length > 1){ ui.pick = i; renderOverlay(); return; }
  doPlay(i, null);
}
function doPlay(i, suit){
  const declared = ui.declared, seat = mySeat, rev = S.rev;
  ui.declared = false;
  mutate(s => s.rev === rev && actPlay(s, seat, i, suit, declared));
}
$('#hand').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if(b) onCardClick(+b.dataset.i); });
$('#drawBtn').addEventListener('click', () => { if(!myTurn() || busy) return; const seat = mySeat, rev = S.rev; mutate(s => s.rev === rev && actDraw(s, seat)); });
$('#passBtn').addEventListener('click', () => { if(!myTurn() || busy) return; const seat = mySeat, rev = S.rev; mutate(s => s.rev === rev && actPass(s, seat)); });
$('#p1Btn').addEventListener('click', () => {
  if(!myTurn() || S.r.hands[mySeat].length !== 2) return;
  ui.declared = true; toast(t('declToast')); renderGameButtons();
});
function openMenu(){
  openPanel(`<h2>${t('menuH')}</h2><p>${t('menuP')}</p>
    <div class="actions"><button class="btn" type="button" data-act="home">${t('homeLater')}</button>
    <button class="btn red" type="button" data-act="local-restart">${t('restart')}</button>
    <button class="btn line" type="button" data-act="close">${t('back')}</button></div>`, 'menu', 'menu');
}
function openLeave(){
  openPanel(`<h2>${t('leaveH')}</h2><p>${t('leaveP')}</p>
    <div class="actions"><button class="btn red" type="button" data-act="leave">${t('leaveBtn')}</button>
    <button class="btn line" type="button" data-act="close">${t('back')}</button></div>`, 'leave', 'leave');
}
$('#gameExit').addEventListener('click', () => { if(mode === 'local') openMenu(); else openLeave(); });
document.addEventListener('click', e => { const b = e.target.closest('[data-go="home"]'); if(b) goHome(); });

/* =========================================================
   オーバーレイ（攻撃・当て返し・マーク選択・結果・最終結果）
   ========================================================= */
function openPanel(html, key, kind){
  ui.ovKey = key || 'x'; ui.ovKind = kind || '';
  $('#panel').innerHTML = html; $('#ov').hidden = false;
  const f = $('#panel [data-act]'); if(f) f.focus();
}
function closePanel(){ ui.ovKey = ''; ui.ovKind = ''; $('#ov').hidden = true; $('#panel').innerHTML = ''; }

function renderOverlay(){
  const s = S;
  if(ui.ovKind === 'menu' || ui.ovKind === 'leave') return;
  if(!s || !s.r){ closePanel(); return; }
  const r = s.r;
  // マーク選択（自分の操作中だけ）
  if(ui.pick !== null){
    if(!myTurn() || !r.hands[mySeat][ui.pick] || r.hands[mySeat][ui.pick].r !== 3){ ui.pick = null; }
    else {
      const key = 'pick' + s.rev + ':' + ui.pick;
      if(ui.ovKey === key) return;
      const i = ui.pick, h = r.hands[mySeat];
      openPanel(`<h2>${t('pickH')}</h2>
        <p>${t('pickP', cname(h[i]))}</p>
        <div class="suits">${SUITS.map(x => {
          const n = h.filter((c,k) => k !== i && c.s === x).length;
          return `<button type="button" class="suit-btn ${colorOf(x)==='red'?'red':''}" data-act="suit" data-s="${x}">${x}<small>${t('inHand', n)}</small></button>`;
        }).join('')}</div>
        <div class="actions"><button class="btn line" type="button" data-act="suit-cancel">${t('cancel')}</button></div>`, key, 'pick');
      return;
    }
  }
  // 攻撃の判断
  if(s.status === 'playing' && r.phase === 'attack' && r.atk && r.atk.queue[0] === mySeat){
    const key = 'atk' + s.rev;
    if(ui.ovKey === key) return;
    const c = r.atk.card, sum = matchVal(r.hands[mySeat], c), d = esc(seatName(s, r.atk.d));
    openPanel(`<h2>${t('atkH')}</h2>
      <div class="vs"><div class="card big ${isRed(c)?'red':''}">${cardHTML(c)}</div>
      <p>${t('atkP', d, cname(c), sum, sum)}</p></div>
      <p>${t('atkNote', d)}</p>
      <div class="actions"><button class="btn gold" type="button" data-act="atk-yes">${t('atkYes')}</button>
      <button class="btn line" type="button" data-act="atk-no">${t('no')}</button></div>`, key, 'atk');
    return;
  }
  // 当て返しの判断
  if(s.status === 'playing' && r.phase === 'counter' && r.ctr && r.ctr.d === mySeat){
    const key = 'ctr' + s.rev;
    if(ui.ovKey === key) return;
    const c = r.ctr, me = r.hands[mySeat], a = esc(seatName(s, c.attacker));
    const twos = me.filter(x => x.r === 2).length;
    openPanel(`<h2>${t('ctrH')}</h2>
      <div class="vs"><div class="card big ${isRed(c.card)?'red':''}">${cardHTML(c.card)}</div>
      <p>${t('ctrP', a, c.val, c.val)}</p></div>
      <p>${t('ctrNote', a, c.val, twos)}</p>
      <div class="actions"><button class="btn gold" type="button" data-act="ctr-yes">${t('ctrYes')}</button>
      <button class="btn line" type="button" data-act="ctr-no">${t('no')}</button></div>`, key, 'ctr');
    return;
  }
  // 結果
  if(r.phase === 'result' && r.result){
    const key = 'res' + s.game + ':' + s.history.length;
    if(ui.ovKey === key) return;
    const res = r.result, last = s.game >= 10, ex = extraText(s, res);
    openPanel(`<h2>${esc(t('resH', s.game, headText(s, res)))}</h2>
      ${ex ? `<p>${esc(ex)}</p>` : ''}
      <div class="tblwrap"><table>
        <thead><tr><th>${t('colName')}</th><th>${t('colLeft')}</th><th>${t('colBase')}</th><th>${t('colMult')}</th><th>${t('colNow')}</th><th>${t('colTotal')}</th></tr></thead>
        <tbody>${res.rows.map(x => `<tr>
          <td>${esc(seatName(s, x.i))}${x.win?` <span class="win">${t('winTag')}</span>`:''}</td>
          <td class="cards">${x.hand.length ? x.hand.map(miniHTML).join('') : '—'}</td>
          <td>${x.win?'—':x.base}</td>
          <td>${x.win?'—':'×'+x.mult}${x.notes.map(n => `<span class="note">${esc(noteText(n))}</span>`).join('')}</td>
          <td><b>${x.score}</b></td><td>${s.totals[x.i]}</td></tr>`).join('')}</tbody>
      </table></div>
      <div class="actions"><button class="btn gold" type="button" data-act="next">${last ? t('finalBtn') : t('nextBtn', s.game+1)}</button></div>
      ${mode === 'online' ? `<p class="hint">${t('nextHint')}</p>` : ''}`, key, 'res');
    return;
  }
  // 最終結果
  if(r.phase === 'final' || s.status === 'done'){
    const key = 'final' + s.rev;
    if(ui.ovKind === 'final' && ui.ovKey) return;
    const order = [0,1,2,3].sort((a,b) => s.totals[a]-s.totals[b]);
    const best = s.totals[order[0]];
    const champs = order.filter(i => s.totals[i] === best).map(i => esc(seatName(s,i))).join(' · ');
    openPanel(`<h2>${t('finalH', champs)}</h2>
      <div class="tblwrap"><table>
        <thead><tr><th>${t('colRank')}</th><th>${t('colName')}</th><th>${t('colTotal')}</th></tr></thead>
        <tbody>${order.map(i => `<tr class="${s.totals[i]===best?'rank1':''}"><td>${t('rankN', 1+order.filter(j => s.totals[j] < s.totals[i]).length)}</td><td style="text-align:left">${esc(seatName(s,i))}</td><td>${s.totals[i]}</td></tr>`).join('')}</tbody>
      </table></div>
      <div class="tblwrap"><table>
        <thead><tr><th>${t('colGame')}</th>${s.seats.map((x,i) => `<th>${esc(seatName(s,i))}</th>`).join('')}</tr></thead>
        <tbody>${s.history.map(h => `<tr><td>${t('gameRow', h.game, h.game===10)}</td>${h.scores.map(v => `<td>${v}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
      <div class="actions">${mode === 'local'
        ? `<button class="btn gold" type="button" data-act="local-restart">${t('again')}</button><button class="btn line" type="button" data-act="home">${t('homeBtn')}</button>`
        : `<button class="btn gold" type="button" data-act="lobby">${t('toLobby')}</button>`}</div>`, key, 'final');
    return;
  }
  if(ui.ovKey) closePanel();
}

$('#panel').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a === 'suit'){
    const i = ui.pick; ui.pick = null; closePanel();
    if(i !== null && myTurn()) doPlay(i, b.dataset.s);
  }
  else if(a === 'suit-cancel'){ ui.pick = null; closePanel(); }
  else if(a === 'atk-yes' || a === 'atk-no' || a === 'ctr-yes' || a === 'ctr-no'){
    const seat = mySeat, rev = S.rev, yes = a.endsWith('yes');
    closePanel(); ui.ovKey = 'wait' + rev;
    const ok = await mutate(s => s.rev === rev && (a.startsWith('atk') ? actAttack(s, seat, yes) : actCounter(s, seat, yes)));
    if(!ok){ ui.ovKey = ''; renderOverlay(); }
  }
  else if(a === 'next'){
    const g = S.game;
    b.disabled = true;
    const ok = await mutate(s => actNext(s, g));
    if(ok && mode === 'online' && S.status === 'done') saveResult(S);
    if(ok && mode === 'local' && S.status === 'done') ls.del(LOCAL_KEY);
    if(!ok) b.disabled = false;
  }
  else if(a === 'local-restart'){ closePanel(); ls.del(LOCAL_KEY); startLocal(true); }
  else if(a === 'home'){ goHome(); }
  else if(a === 'lobby'){ goLobby(); }
  else if(a === 'leave'){ closePanel(); leaveTable(); }
  else if(a === 'close'){ closePanel(); renderOverlay(); }
});

/* =========================================================
   起動
   ========================================================= */
applyStatic();
$('#heroCards').innerHTML = [{s:'♠',r:1},{s:'♥',r:13},{s:'♦',r:12},{s:'♣',r:11}]
  .map(c => `<div class="card ${isRed(c)?'red':''}">${cardHTML(c)}</div>`).join('');
renderHome();
show('home');
connect();

// テスト用フック（ページの動作には影響しません）
window.__pageone = {get S(){ return S; }, cpuAct, actCounter, resolveAttack, endRound, startRound, setLang:l => { lang = l; renderAll(); }};
})();
</script>
